[project]
name = "rag-system"
version = "0.1.0"
description = "RAG system based on Python + LangChain + Chinese LLM APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ===== 框架与编排 =====
    "langchain>=0.2,<0.4",
    "langchain-community>=0.2",
    "langchain-openai>=0.1",
    "langchain-text-splitters>=0.2",
    "langchain-chroma>=0.1",
    "langchain-qdrant>=0.1",
    # ===== 文档解析 =====
    "pypdf>=4.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # ===== Embedding / Rerank (通义 DashScope) =====
    "dashscope>=1.20",
    # ===== 向量库 =====
    "chromadb>=0.5",
    "qdrant-client>=1.9",
    # ===== 混合检索 BM25 =====
    "rank-bm25>=0.2.2",
    # ===== 配置 =====
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    # ===== Web 服务 =====
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # ===== 其他 =====
    "httpx>=0.27",
    "pymilvus[milvus-lite]>=2.5.7,<2.6",
    "langchain-milvus>=0.2.1",
    "sqlalchemy>=2.0.52",
    "pymysql>=1.2.0",
    "pyjwt>=2.13.0",
    "bcrypt>=4.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=9.1.1",
    "ragas>=0.2.6,<0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
