# Alembic 数据库迁移配置
# 文档: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# 迁移脚本目录
script_location = alembic

# 数据库连接串(从环境变量读取,此处为占位)
# 实际运行时由 env.py 从 config.settings 获取
sqlalchemy.url =

# 迁移脚本文件名模板
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 每个迁移脚本是否输出到 stdout
output_encoding = utf-8

[post_write_hooks]
# 迁移脚本生成后自动格式化(可选)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
